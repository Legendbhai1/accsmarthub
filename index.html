<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccsMartHub — Buy &amp; Sell Social Media Accounts</title>
  <meta
    name="description"
    content="AccsMartHub is the professional marketplace for buying and selling social media accounts: verified sellers, documented ownership and escrow-protected transfers on every order."
  />
  <script>
    // Applies the stored light/dark theme before the first paint. Without this
    // the page renders light and then flips once React mounts, which reads as
    // a flash on every reload. Kept in sync with src/lib/theme.tsx.
    (function () {
      try {
        var stored = localStorage.getItem("accsmarthub.theme");
        var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.style.colorScheme = "light";
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
